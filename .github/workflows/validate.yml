name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: designs-repo
      - uses: actions/checkout@v4
        with:
          repository: kewe87/CaseHUD
          path: casehud
      - uses: actions/setup-go@v5
        with:
          go-version-file: casehud/go.mod
      - name: Validate with the CaseHUD parser
        run: |
          mkdir -p casehud/cmd/validate-designs
          cp designs-repo/tools/validate/main.go casehud/cmd/validate-designs/main.go
          cd casehud && go run ./cmd/validate-designs ../designs-repo
